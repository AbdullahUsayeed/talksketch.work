<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        width: 310px; margin: 0; padding: 14px;
        font: 13px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f6f2e9; color: #14130f;
      }
      h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.02em; }
      p.sub { margin: 0 0 12px; color: #6b675c; font-size: 11.5px; }
      label { display: grid; gap: 3px; font-size: 11px; font-weight: 600; color: #2a2822; margin-bottom: 8px; }
      input {
        width: 100%; font: inherit; font-size: 12px; padding: 7px 8px;
        border: 1px solid #ded6c5; border-radius: 7px; background: #fffdf7; outline: none;
      }
      input:focus { border-color: #2f6bff; }
      .row { display: flex; gap: 8px; margin-top: 4px; }
      button {
        flex: 1; font: inherit; font-size: 12px; font-weight: 600;
        padding: 9px 10px; border-radius: 8px; cursor: pointer;
        border: 1.5px solid #14130f; background: #14130f; color: #f6f2e9;
      }
      button.secondary { background: transparent; color: #14130f; }
      button:disabled { opacity: .45; cursor: default; }
      .status { margin-top: 11px; padding-top: 10px; border-top: 1px solid #ded6c5; font-size: 11.5px; color: #6b675c; }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #b7b1a3; margin-right: 6px; }
      .dot.on { background: #17b26a; box-shadow: 0 0 0 3px rgba(23,178,106,.15); }
      .err { color: #d33a1b; margin-top: 6px; word-break: break-word; }
      a { color: #2f6bff; font-size: 11.5px; font-weight: 600; text-decoration: none; }
      .hint { font-size: 10.5px; color: #6b675c; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>TalkSketch Capture</h1>
    <p class="sub">Google Meet captions → live notes</p>

    <label>Server<input id="server" placeholder="http://localhost:8788" /></label>
    <label>Access code<input id="code" placeholder="TALKSKETCH" /></label>
    <label>Topic<input id="topic" placeholder="Family meeting" /></label>
    <label>Participants<input id="participants" placeholder="Sarah, Tom" /></label>

    <div class="row">
      <button id="start">Start capture</button>
      <button id="stop" class="secondary">Stop</button>
    </div>

    <div class="status">
      <div><span class="dot" id="dot"></span><span id="state">Idle</span></div>
      <div id="lines">0 caption lines sent</div>
      <div class="err" id="error"></div>
      <div class="hint">
        In Meet, turn on captions (CC) before starting. Keep this tab open on the call.
      </div>
      <div style="margin-top:8px"><a id="dash" href="#" target="_blank">Open live notes →</a></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
