# nginx: TalkSketch download host

Copy of the `/download/` blocks used on the Lightsail box
(`/etc/nginx/sites-available/talksketch-api`). Deploying from the repo is a manual
`sudo nginx -t && sudo systemctl reload nginx` after editing the server file.

```nginx
# Versioned installers live here. Immutable: winget pins their SHA-256.
location /download/ {
    alias /var/www/talksketch-downloads/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Floating alias the website links to. Repointed by desktop/scripts/publish-download.mjs.
location = /download/latest/TalkSketch-Setup.exe {
    alias /var/www/talksketch-downloads/TalkSketch-Setup.exe;
    types { }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'attachment; filename="TalkSketch-Setup.exe"' always;
}
# Checksum for the floating alias, consumed by install.ps1.
location = /download/latest/TalkSketch-Setup.exe.sha256 {
    alias /var/www/talksketch-downloads/TalkSketch-Setup.exe.sha256;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}
```

`Content-Disposition: attachment` is what makes the browser save the file instead of
navigating to it, and it keeps the clean `TalkSketch-Setup.exe` name even though the
target is a symlink.

Permissions: `www-data:www-data`, `644` for files, and the symlink is `www-data`-owned
(`chown -h`).
